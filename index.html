<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Soundboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Game Soundboard</h1>
    <p>Choose an action to bring your pixel hero to life.</p>

    <div class="stage" aria-hidden="true">
      <div id="hero">
        <div class="hero-head"></div>
        <div class="hero-body"></div>
        <div class="hero-feet"></div>
      </div>
    </div>

    <div class="buttons">
      <button type="button" data-sound="attack">Attack</button>
      <button type="button" data-sound="defense">Defense</button>
      <button type="button" data-sound="heal">Heal</button>
      <button type="button" id="stop">Stop</button>
    </div>

    <p id="status" role="status">Ready. Choose a sound.</p>
  </main>
</body>
</html>
